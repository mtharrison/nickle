name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-test:
    name: ${{ matrix.target }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - run: npm run build:native -- --target ${{ matrix.target }}
      - run: cargo test --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - run: npm test
      - name: Check the native addon was used
        run: node -e "import('./dist/native.js').then(m => { if (m.mode() !== 'native') process.exit(1) })"
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error
