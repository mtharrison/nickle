[package]
name = "nickle-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
memmap2 = "0.9"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
